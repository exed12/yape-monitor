<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reportes Yape</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --yape:#6C2FAD;--yape-light:#8B3FD9;--yape-dim:#3D1A63;--yape-glow:rgba(108,47,173,0.25);
    --bg:#0D0B12;--surface:#14111E;--surface2:#1C1828;--border:rgba(108,47,173,0.2);--border2:rgba(255,255,255,0.06);
    --text:#F0EBF8;--muted:#8B7FA8;--green:#22D98F;--green-dim:rgba(34,217,143,0.12);
    --amber:#F59E0B;--amber-dim:rgba(245,158,11,0.12);--font:'Sora',sans-serif;--mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(108,47,173,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(108,47,173,0.04) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
  .wrap{position:relative;z-index:1;max-width:700px;margin:0 auto;padding:24px 16px 60px}
  header{display:flex;align-items:center;gap:14px;margin-bottom:28px}
  .logo{width:48px;height:48px;background:var(--yape);border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 24px var(--yape-glow)}
  .logo svg{width:26px;height:26px;fill:white}
  .header-text h1{font-size:20px;font-weight:600;letter-spacing:-0.3px}
  .header-text p{font-size:12px;color:var(--muted);font-family:var(--mono);margin-top:2px}
  .nav-link{margin-left:auto;font-size:12px;font-family:var(--mono);color:var(--yape-light);text-decoration:none;border:1px solid var(--border);padding:6px 12px;border-radius:8px}

  /* Filtros */
  .filtros{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
  .btn-filtro{padding:8px 16px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-size:12px;font-family:var(--mono);cursor:pointer;transition:all 0.2s}
  .btn-filtro.active{background:var(--yape);border-color:var(--yape);color:white}
  .btn-filtro:hover:not(.active){border-color:var(--border);color:var(--text)}

  /* Selector fecha */
  .fecha-picker{display:none;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
  .fecha-picker.visible{display:flex}
  .fecha-picker label{font-size:12px;color:var(--muted);font-family:var(--mono)}
  .fecha-picker input,.fecha-picker select{background:var(--surface);border:1px solid var(--border2);color:var(--text);font-family:var(--mono);font-size:12px;padding:6px 10px;border-radius:8px}

  /* Métricas */
  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
  .metric{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 14px;position:relative;overflow:hidden}
  .metric::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--yape),var(--yape-light));opacity:0.6}
  .metric-label{font-size:10px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px}
  .metric-value{font-size:20px;font-weight:700;color:var(--green);letter-spacing:-0.5px;line-height:1}
  .metric-value.white{color:var(--text)}

  /* Gráfico de barras por día */
  .chart-box{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:16px;margin-bottom:20px}
  .chart-title{font-size:11px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:14px}
  .bars{display:flex;align-items:flex-end;gap:6px;height:80px}
  .bar-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0}
  .bar{width:100%;background:var(--yape);border-radius:4px 4px 0 0;min-height:3px;transition:height 0.4s;position:relative}
  .bar:hover{background:var(--yape-light)}
  .bar-label{font-size:9px;font-family:var(--mono);color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
  .bar-val{font-size:9px;font-family:var(--mono);color:var(--green);text-align:center}

  /* Tabla pagos */
  .section-label{font-size:10px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
  .tabla{width:100%;border-collapse:collapse}
  .tabla th{font-size:10px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;padding:8px 12px;border-bottom:1px solid var(--border2);text-align:left}
  .tabla td{font-size:13px;padding:10px 12px;border-bottom:1px solid var(--border2);color:var(--text)}
  .tabla tr:last-child td{border-bottom:none}
  .tabla tr:hover td{background:rgba(108,47,173,0.05)}
  .monto-cell{color:var(--green);font-family:var(--mono);font-weight:600;text-align:right}
  .codigo-cell{font-family:var(--mono);font-size:12px;color:var(--amber);text-align:center}
  .hora-cell{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .tabla-wrap{background:var(--surface);border:1px solid var(--border2);border-radius:14px;overflow:hidden;overflow-x:auto}

  /* Export */
  .export-btn{display:flex;align-items:center;gap:8px;margin-top:16px;padding:10px 18px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:13px;font-family:var(--font);cursor:pointer;transition:all 0.15s}
  .export-btn:hover{background:var(--surface2);border-color:var(--yape)}
  .export-btn svg{width:16px;height:16px}

  .empty{text-align:center;padding:40px;color:var(--muted);font-size:14px}
  .loader{display:flex;align-items:center;justify-content:center;gap:5px;padding:32px}
  .loader span{width:6px;height:6px;border-radius:50%;background:var(--yape);animation:bounce 1.2s infinite ease-in-out}
  .loader span:nth-child(2){animation-delay:.15s}.loader span:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,80%,100%{transform:scale(0.6);opacity:0.4}40%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg></div>
    <div class="header-text"><h1>Reportes Yape</h1><p id="subtitulo">Cargando...</p></div>
    <a href="/" class="nav-link">← Dashboard</a>
  </header>

  <!-- Filtros periodo -->
  <div class="filtros">
    <button class="btn-filtro active" onclick="setPeriodo('dia')">Hoy</button>
    <button class="btn-filtro" onclick="setPeriodo('semana')">7 días</button>
    <button class="btn-filtro" onclick="setPeriodo('mes')">Este mes</button>
    <button class="btn-filtro" onclick="setPeriodo('anio')">Este año</button>
    <button class="btn-filtro" onclick="setPeriodo('general')">General</button>
  </div>

  <!-- Selector de fecha específica -->
  <div class="fecha-picker" id="fecha-picker">
    <label id="fecha-label">Fecha:</label>
    <input type="date" id="fecha-input" oninput="cargarReporte()">
    <select id="mes-select" style="display:none" onchange="cargarReporte()"></select>
    <select id="anio-select" style="display:none" onchange="cargarReporte()"></select>
  </div>

  <!-- Métricas -->
  <div class="metrics">
    <div class="metric"><div class="metric-label">Total</div><div class="metric-value" id="m-total">S/ 0.00</div></div>
    <div class="metric"><div class="metric-label">Pagos</div><div class="metric-value white" id="m-cantidad">0</div></div>
    <div class="metric"><div class="metric-label">Promedio</div><div class="metric-value" id="m-promedio">S/ 0.00</div></div>
  </div>

  <!-- Gráfico -->
  <div class="chart-box" id="chart-box" style="display:none">
    <div class="chart-title">Monto por día</div>
    <div class="bars" id="bars"></div>
  </div>

  <!-- Tabla -->
  <div class="section-label">Detalle de pagos</div>
  <div class="tabla-wrap">
    <div id="tabla-content"><div class="loader"><span></span><span></span><span></span></div></div>
  </div>

  <button class="export-btn" onclick="exportarCSV()">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
    Exportar CSV
  </button>
</div>

<script>
  let periodo = 'dia';
  let datosActuales = [];

  function setPeriodo(p) {
    periodo = p;
    document.querySelectorAll('.btn-filtro').forEach((b,i) => {
      b.classList.toggle('active', ['dia','semana','mes','anio','general'][i] === p);
    });

    const picker = document.getElementById('fecha-picker');
    const fechaInput = document.getElementById('fecha-input');
    const mesSelect = document.getElementById('mes-select');
    const anioSelect = document.getElementById('anio-select');
    const fechaLabel = document.getElementById('fecha-label');

    fechaInput.style.display = 'none';
    mesSelect.style.display = 'none';
    anioSelect.style.display = 'none';

    if (p === 'dia') {
      picker.classList.add('visible');
      fechaInput.style.display = 'block';
      fechaLabel.textContent = 'Fecha:';
      if (!fechaInput.value) fechaInput.valueAsDate = new Date();
    } else if (p === 'mes') {
      picker.classList.add('visible');
      mesSelect.style.display = 'block';
      anioSelect.style.display = 'block';
      fechaLabel.textContent = 'Mes:';
      poblarMesAnio();
    } else if (p === 'anio') {
      picker.classList.add('visible');
      anioSelect.style.display = 'block';
      fechaLabel.textContent = 'Año:';
      poblarAnio();
    } else {
      picker.classList.remove('visible');
    }

    cargarReporte();
  }

  function poblarMesAnio() {
    const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    const mesSelect = document.getElementById('mes-select');
    const anioSelect = document.getElementById('anio-select');
    const hoy = new Date();
    mesSelect.innerHTML = meses.map((m,i) => `<option value="${String(i+1).padStart(2,'0')}" ${i===hoy.getMonth()?'selected':''}>${m}</option>`).join('');
    poblarAnio();
  }

  function poblarAnio() {
    const anioSelect = document.getElementById('anio-select');
    const hoy = new Date();
    let opts = '';
    for (let y = hoy.getFullYear(); y >= 2024; y--) opts += `<option value="${y}" ${y===hoy.getFullYear()?'selected':''}>${y}</option>`;
    anioSelect.innerHTML = opts;
  }

  async function cargarReporte() {
    document.getElementById('tabla-content').innerHTML = '<div class="loader"><span></span><span></span><span></span></div>';

    let url = '/reporte?periodo=' + periodo;
    if (periodo === 'dia') {
      const v = document.getElementById('fecha-input').value;
      if (v) url += '&fecha=' + v.split('-').reverse().join('/');
    } else if (periodo === 'mes') {
      const m = document.getElementById('mes-select').value;
      const a = document.getElementById('anio-select').value;
      url += '&fecha=' + a + '-' + m;
    } else if (periodo === 'anio') {
      const a = document.getElementById('anio-select').value;
      url += '&fecha=' + a;
    }

    try {
      const res = await fetch(url);
      const data = await res.json();
      datosActuales = data.pagos || [];
      renderReporte(data);
    } catch(e) {
      document.getElementById('tabla-content').innerHTML = '<div class="empty">Error al cargar datos</div>';
    }
  }

  function renderReporte(data) {
    const { pagos, total, cantidad } = data;
    const promedio = cantidad > 0 ? total / cantidad : 0;

    document.getElementById('m-total').textContent = 'S/ ' + total.toFixed(2);
    document.getElementById('m-cantidad').textContent = cantidad;
    document.getElementById('m-promedio').textContent = 'S/ ' + promedio.toFixed(2);

    // Subtítulo
    const labels = {dia:'Hoy',semana:'Últimos 7 días',mes:'Este mes',anio:'Este año',general:'Todos los tiempos'};
    document.getElementById('subtitulo').textContent = labels[periodo] + ' · ' + cantidad + ' pagos';

    // Gráfico por día
    const chartBox = document.getElementById('chart-box');
    if (periodo !== 'dia' && Object.keys(data.porDia||{}).length > 1) {
      chartBox.style.display = 'block';
      renderChart(data.porDia);
    } else {
      chartBox.style.display = 'none';
    }

    // Tabla
    if (!pagos || pagos.length === 0) {
      document.getElementById('tabla-content').innerHTML = '<div class="empty">Sin pagos en este período</div>';
      return;
    }

    document.getElementById('tabla-content').innerHTML = `
      <table class="tabla">
        <thead><tr>
          <th>Fecha</th><th>Hora</th><th>Nombre</th>
          <th style="text-align:center">Cód.</th>
          <th style="text-align:right">Monto</th>
        </tr></thead>
        <tbody>
          ${pagos.map(p => `<tr>
            <td class="hora-cell">${p.fecha||''}</td>
            <td class="hora-cell">${p.hora||''}</td>
            <td>${p.nombre||'—'}</td>
            <td class="codigo-cell">${p.codigo||'—'}</td>
            <td class="monto-cell">+S/ ${parseFloat(p.monto||0).toFixed(2)}</td>
          </tr>`).join('')}
        </tbody>
      </table>`;
  }

  function renderChart(porDia) {
    const dias = Object.keys(porDia).sort();
    const max = Math.max(...Object.values(porDia));
    document.getElementById('bars').innerHTML = dias.map(d => {
      const val = porDia[d];
      const pct = max > 0 ? (val/max)*100 : 0;
      const label = d.split('/').slice(0,2).join('/');
      return `<div class="bar-col">
        <div class="bar-val">S/${val.toFixed(0)}</div>
        <div class="bar" style="height:${Math.max(pct*0.6,3)}px"></div>
        <div class="bar-label">${label}</div>
      </div>`;
    }).join('');
  }

  function exportarCSV() {
    if (!datosActuales.length) return;
    const headers = ['Fecha','Hora','Nombre','Codigo Seguridad','Monto'];
    const rows = datosActuales.map(p => [
      p.fecha||'', p.hora||'',
      '"'+(p.nombre||'').replace(/"/g,'""')+'"',
      p.codigo||'',
      (p.monto||0).toFixed(2)
    ].join(','));
    const csv = [headers.join(','), ...rows].join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'reporte-yape-'+periodo+'.csv'; a.click();
    URL.revokeObjectURL(url);
  }

  // Iniciar con hoy
  document.getElementById('fecha-input').valueAsDate = new Date();
  document.getElementById('fecha-picker').classList.add('visible');
  document.getElementById('fecha-input').style.display = 'block';
  cargarReporte();
</script>
</body>
</html>
